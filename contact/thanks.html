<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks | TapGrowth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(49,133,255,0.20), transparent 32%),
        #061126;
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(600px, 100%);
      text-align: center;
      background: #0c1a35;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 46px 28px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.28);
    }
    .check {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      background: rgba(49,133,255,0.14);
      border: 1px solid rgba(49,133,255,0.35);
      color: #64a5ff;
      font-size: 30px;
      font-weight: 900;
    }
    h1 { font-size: clamp(34px, 7vw, 52px); line-height: 1.05; margin-bottom: 14px; }
    h1 span { color: #3185ff; }
    p { color: #b8c7df; font-size: 17px; margin: 0 auto 26px; max-width: 470px; }
    a {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: #3185ff;
      font-weight: 800;
      border-radius: 12px;
      padding: 14px 22px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1>Enquiry <span>Sent.</span></h1>
    <p>Thanks for contacting TapGrowth. Your details have been submitted and we’ll get back to you as soon as possible.</p>
    <a href="/">Back to TapGrowth</a>
  </main>
</body>
</html>
