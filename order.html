<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapGrowth Order</title><style>html,body{margin:0;width:100%;height:100%;background:#061126;overflow:hidden}#app{width:100%;height:100%;border:0;display:block;background:#061126}</style></head><body><iframe id="app" title="TapGrowth order form"></iframe><script>
const q=location.search||'';const key=['review','landing','pro'].includes(new URLSearchParams(q).get('plan'))?new URLSearchParams(q).get('plan'):'landing';const frame=document.getElementById('app');const loadedAt=Date.now();frame.src='/order-v2.html'+q;
frame.addEventListener('load',()=>{let d;try{d=frame.contentDocument}catch(e){return}if(!d)return;const form=d.getElementById('orderForm');if(!form||form.dataset.tgFixed==='1')return;form.dataset.tgFixed='1';
const style=d.createElement('style');style.textContent='.tg-human{margin:18px 0 14px;padding:14px;border-radius:12px;background:#f7f9fc;border:1px solid #d7dfeb;color:#0b1830}.tg-human label{display:flex;align-items:center;gap:11px;margin:0;color:#0b1830;cursor:pointer}.tg-human input{width:22px;height:22px;accent-color:#3185ff;flex:0 0 auto}.tg-human strong{display:block;font-size:14px}.tg-human small{display:block;color:#607089;font-size:10px;font-weight:600;margin-top:2px}.tg-submit-error{display:none;margin:10px 0;padding:11px 12px;border-radius:10px;background:rgba(255,80,80,.08);border:1px solid rgba(255,120,120,.35);color:#ffb0b0;font-size:11px}.tg-submit-error.show{display:block}';d.head.appendChild(style);
const head=d.querySelector('.head p');if(head)head.textContent='Tick the human check and submit your details. TapGrowth confirms the form was accepted before showing secure payment.';const process=d.querySelector('.process');if(process)process.innerHTML='<div><strong>1.</strong> Enter your business details</div><div><strong>2.</strong> Tick the human confirmation box</div><div><strong>3.</strong> Your details are sent to TapGrowth</div><div><strong>4.</strong> Continue to secure Stripe payment</div>';
const oldCaptcha=form.querySelector('[name="_captcha"]');if(oldCaptcha)oldCaptcha.value='false';const oldNext=form.querySelector('[name="_next"]');if(oldNext)oldNext.value='https://tapgrowth.com.au/order/thanks.html';
const btn=d.getElementById('submitBtn');const status=d.getElementById('status');if(status){status.textContent='Sending your details to TapGrowth…';status.classList.remove('show')}
const human=d.createElement('div');human.className='tg-human';human.innerHTML='<label><input id="tgHuman" name="Human Confirmation" type="checkbox" value="Confirmed" required><span><strong>I’m not a robot</strong><small>Required before your order details can be sent.</small></span></label>';const err=d.createElement('div');err.className='tg-submit-error';err.textContent='We couldn’t send your details. Please check your connection and try again.';if(btn){btn.textContent='Submit Details → Continue To Payment';btn.parentNode.insertBefore(human,btn);btn.parentNode.insertBefore(err,btn)}
const choices=[...d.querySelectorAll('#choices input[type="checkbox"]')];const addKey=d.getElementById('addKeychain');function save(){try{localStorage.setItem('tg_checkout',JSON.stringify({plan:key,keychain:!!(addKey&&addKey.checked),ts:Date.now()}))}catch(e){}}save();if(addKey)addKey.addEventListener('change',save);
function clean(v,p){v=(v||'').trim();if(!v)return v;if(p==='instagram'&&v.startsWith('@'))return v;let t=v;if(!/^https?:\/\//i.test(t)&&/\./.test(t))t='https://'+t;try{const u=new URL(t);const h=u.hostname.toLowerCase().replace(/^www\./,'').replace(/^m\./,'');const parts=u.pathname.split('/').filter(Boolean);if(p==='instagram'&&h.endsWith('instagram.com')){if(parts[0]&&!['p','reel','stories','share'].includes(parts[0].toLowerCase()))return '@'+parts[0];return 'instagram.com/'+parts.join('/')}if(p==='facebook'&&(h.endsWith('facebook.com')||h.endsWith('fb.com')))return 'facebook.com'+(u.pathname||'/').replace(/\/+$/,'')}catch(e){}return v.replace(/^https?:\/\//i,'').replace(/[?#].*$/,'')}
function prepare(){d.querySelectorAll('[data-social]').forEach(el=>{el.value=clean(el.value,el.dataset.social)})}
form.addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();err.classList.remove('show');if(key!=='review'&&!choices.some(c=>c.checked)){const ce=d.getElementById('choiceError');if(ce)ce.classList.add('show');d.getElementById('choices')?.scrollIntoView({behavior:'smooth',block:'center'});return}if(!form.checkValidity()){form.reportValidity();return}if(Date.now()-loadedAt<700){err.textContent='Please wait a moment and try again.';err.classList.add('show');return}prepare();save();btn.disabled=true;btn.textContent='Sending Details…';if(status)status.classList.add('show');try{const fd=new FormData(form);fd.delete('_captcha');fd.delete('_next');fd.set('_url','https://tapgrowth.com.au/order.html'+q);const r=await fetch('https://formsubmit.co/ajax/Bradley_mayor@hotmail.com',{method:'POST',body:fd,headers:{Accept:'application/json'}});let data={};try{data=await r.json()}catch(x){}if(!r.ok||String(data.success).toLowerCase()==='false')throw new Error(data.message||'Submission failed');top.location.assign('/order/thanks.html')}catch(x){console.error(x);err.textContent='We couldn’t send your details. Please check your connection and try again.';err.classList.add('show');btn.disabled=false;btn.textContent='Submit Details → Continue To Payment';if(status)status.classList.remove('show')}},true);
});
</script></body></html>
